# https://www.espboards.dev/esp31/d1-mini32/
# https://github.com/nichlasrohde/ha-ecl-modbus/tree/main/custom_components/ecl_modbus
#
# IMPORTANT: ESPHome uses zero-based notation and not the 1-based notation from the Danfoss documentation !
#
#===========================================================================================================
substitutions:
  name: modbus-danfoss
  shortname: "MBK212"
  ip: 212
  brand: "Danfoss"
  model: "ECL120"
  friendly_name: "Modbus - ${brand} {model}"
  device_description: "Heating system control"
  modbus_ctrl_id: modbus_${brand}
  modbus_id: modbus1
  modbus_addr: 5

  uart_id: "mbus"

  status_led_pin: GPIO26
#===========================================================================================================



#===========================================================================================================
packages:
  #seeed_esp_c6: !include common/seeed-xiao-esp32-c6-board.yaml
  esp32:        !include common/esp32-generic.yaml
  basic_config: !include common/basic-config-esp32.yaml
  debug_config: !include common/debug.yaml
  sntp_config:  !include common/sntp.yaml
  uart_config:  !include common/uart_config.yaml
  web_config:   !include common/webserver.yaml
  wifi_config:  !include common/wifi.yaml
  input_regs:   !include danfoss_ecl120/input_registers.yaml
  # Only one of the following two lines may be enabled 
  #holding_regs: !include danfoss_ecl120/holding_registers_readonly.yaml
  holding_regs: !include danfoss_ecl120/holding_registers_readwrite.yaml
  
esphome:
  name_add_mac_suffix: false
  includes:
    - danfoss_ecl120/lambda_helpers.h
      
api:
  encryption:
    key: !secret modbus_danfoss_ecl120__encryption_key
#===========================================================================================================



#===========================================================================================================
ota:
  - platform: esphome
    encryption: 
    #password: !secret modbus_danfoss_ecl120__ota_password
#===========================================================================================================



#===========================================================================================================
modbus:
  #flow_control_pin: GPIOXX
  #send_wait_time: 250ms
  send_wait_time: 50ms
  id: ${modbus_id}

modbus_controller:
  - id: ${modbus_ctrl_id}_15
    ## the Modbus device addr
    address: ${modbus_addr}
    modbus_id: ${modbus_id}
    setup_priority: -10
    update_interval: 15s
  - id: ${modbus_ctrl_id}_60
    ## the Modbus device addr
    address: ${modbus_addr}
    modbus_id: ${modbus_id}
    setup_priority: -10
    update_interval: 60s
  - id: ${modbus_ctrl_id}_300
    ## the Modbus device addr
    address: ${modbus_addr}
    modbus_id: ${modbus_id}
    setup_priority: -10
    update_interval: 300s
#===========================================================================================================
  


