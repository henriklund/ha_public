#===========================================================================================================
substitutions:
  wifi_subnet: !secret wifi_subnet

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${wifi_subnet}${ip}
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet_mask
  reboot_timeout: 3min
  min_auth_mode: wpa2

