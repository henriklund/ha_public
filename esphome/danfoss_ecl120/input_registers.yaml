# -----------------------------------------------------------------------------
# Circuit 1 - A130 - Heat Status (21000 -> 21099 )
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: input_21001
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 21000
    #1-based address: 21001
    register_type: input
    value_type: U_WORD
    on_value:
      then:
        lambda: |- 
          switch (static_cast<int>(x)) {
            case 0:
              id(circuit1_operation_status).publish_state("Comfort");
              break;
            case 1:
              id(circuit1_operation_status).publish_state("Saving");
              break;
            case 2:
              id(circuit1_operation_status).publish_state("Frost protection");
              break;
            default:
              id(circuit1_operation_status).publish_state("Unknown");
          }
    internal: true
  - platform: modbus_controller
    id: circuit1_heat_demand_status
    name: "Circuit 1 - Heat Status - Heat Demand Status"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 21001
    #1-based address: 21002
    value_type: U_WORD
    register_type: read
    #icon: "mdi:timer-outline"
    disabled_by_default: true
  - platform: modbus_controller
    id: circuit1_boost_remaining_time
    name: "Circuit 1 - Heat Status - Boost remaining time"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 21003
    #1-based address: 21004
    value_type: FP32
    unit_of_measurement: "s"
    register_type: read
    icon: "mdi:timer-outline"
    disabled_by_default: true


