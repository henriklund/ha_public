# -----------------------------------------------------------------------------
# Circuit 1 – Heating Week Schedule (21800 -> 21999 )
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: ${modbus_ctrl_id}_300
    name: "Weekly Schedule - Heating - Day 1"
    id: weekly_schedule_heating_day1
    register_type: holding
    address: 21799
    #1-based address: 21800
    response_size: 24
    raw_encode: HEXBYTES
    lambda: |-
      return format_schedule(x);
    disabled_by_default: true
