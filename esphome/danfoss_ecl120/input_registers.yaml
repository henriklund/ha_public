# -----------------------------------------------------------------------------
# System Settings (2000 -> 3999 )
# -----------------------------------------------------------------------------
# 2000 / 2002 / 2003 are omitted by intention. Changing these may render the ECL120
# unreachable
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: ethernet_ip_address
    name: "${model} - Ethernet IP address"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 2099
    #1-based address: 2100
    register_type: read
    response_size: 16
    raw_encode: ANSI
    entity_category: diagnostic
    lambda: |-
      std::string result;
      for (size_t i = 0; i < x.length() && i < 16; i++) {
        result += x[i];
      }
      return result;
    icon: "mdi:ip-network"
  - platform: modbus_controller
    id: ethernet_mac_address
    name: "${model} - Ethernet MAC address"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 2109
    #1-based address: 2110
    register_type: read
    response_size: 32
    raw_encode: ANSI
    entity_category: diagnostic
    lambda: |-
      std::string result;
      for (size_t i = 0; i < x.length() && i < 32; i++) {
        result += x[i];
      }
      return result;
    icon: "mdi:lan"


