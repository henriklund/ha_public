sensor:
# -----------------------------------------------------------------------------
# System Info (1 -> 1999)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: hardware_version
    name: "${model} - Hardware Version"
    modbus_controller_id: ${modbus_ctrl_id}_300
    address: 77
    #1-based address: 78
    value_type: U_WORD
    entity_category: diagnostic
    register_type: read
    disabled_by_default: true
  - platform: modbus_controller
    id: modbus_message_ok_count
    name: "${model} - Modbus Messages OK Count"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 499
    #1-based address: 500
    value_type: U_DWORD
    entity_category: diagnostic
    register_type: read
    disabled_by_default: true
  - platform: modbus_controller
    id: modbus_message_nok_count
    name: "${model} - Modbus Messages NOK Count"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 501
    #1-based address: 502
    value_type: U_DWORD
    entity_category: diagnostic
    register_type: read
    disabled_by_default: true
  - platform: modbus_controller
    id: runtime_total
    name: "${model} - Runtime - Total"
    modbus_controller_id: ${modbus_ctrl_id}_60
    address: 509
    #1-based address: 510
    value_type: U_DWORD
    entity_category: diagnostic
    register_type: read
    on_value:
      then:
        - text_sensor.template.publish:
            id: runtime_total_human
            state: !lambda |-
              return format_runtime((uint32_t) x);
    disabled_by_default: true
  - platform: modbus_controller
    id: runtime_application
    name: "${model} - Runtime - Application"
    modbus_controller_id: ${modbus_ctrl_id}_60
    address: 511
    #1-based address: 512
    value_type: U_DWORD
    unit_of_measurement: s
    entity_category: diagnostic
    register_type: read
    on_value:
      then:
        - text_sensor.template.publish:
            id: runtime_application_human
            state: !lambda |-
              return format_runtime((uint32_t) x);
    disabled_by_default: true
  - platform: modbus_controller
    id: emergency_mode_running_time
    name: "${model} - Emergency Mode Running Time"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 550
    #1-based address: 551
    value_type: U_DWORD
    unit_of_measurement: s
    entity_category: diagnostic
    register_type: read
    on_value:
      then:
        - text_sensor.template.publish:
            id: emergency_mode_running_time_human
            state: !lambda |-
              return format_runtime((uint32_t) x);
    disabled_by_default: true
  - platform: modbus_controller
    # Treat this as readonly. "holding_registers_readwrite" will handle any writes
    id: time_utc_value
    name: "${model} - Time UTC Value"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 621
    #1-based address: 622
    value_type: U_DWORD
    entity_category: diagnostic
    register_type: holding
    accuracy_decimals: 0
    disabled_by_default: true
  - platform: modbus_controller
    id: time_local_time_epoch
    name: "${model} - Time Local Time (epoch)"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 623
    #1-based address: 624
    value_type: U_DWORD
    entity_category: diagnostic
    register_type: read
    accuracy_decimals: 0
    disabled_by_default: true


# -----------------------------------------------------------------------------
# Inputs (4000 -> 5999)
# -----------------------------------------------------------------------------
# Core temperature sensors (S1–S6)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    # appears to be almost identical  to "Circuit 1 - Heat Sensors - Outside Temperature" (15-20min behind)
    id: sensor_s1_temperature
    name: "Inputs - Sensor S1 temperature"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 3999
    #1-based address: 4000
    value_type: FP32
    unit_of_measurement: °C
    accuracy_decimals: 2
    device_class: temperature
    state_class: measurement
    register_type: read
  - platform: modbus_controller
    id: input_4008
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4008
    #1-based address: 4009
    value_type: U_WORD
    register_type: read
    on_value:
      then:
        lambda: |- 
          id(sensor_s1_temperature_status).publish_state(sensor_temperature_status(static_cast<int>(x)));
    internal: true
