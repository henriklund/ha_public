select:
# -----------------------------------------------------------------------------
# Inputs (4000 -> 5999)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    # Note that both 4398=1 & 4399=2 needs to be configured for SCADA Outdoor Temperature write
    id: outdoor_temperature_source
    name: "Inputs - Outdoor Temperature Source"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4397
    #1-based address: 4398
    optimistic: true
    optionsmap: {'Physical sensor': 0,'Modbus': 1,'Reserved': 2}
    disabled_by_default: true
  - platform: modbus_controller
    # Note that both 4398=1 & 4399=2 needs to be configured for SCADA Outdoor Temperature write
    id: outdoor_temperature_share_config
    name: "Inputs - Outdoor Temperature Share Config"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4398
    #1-based address: 4399
    optimistic: true
    optionsmap: {'Sharing Off': 0,'Share on Modbus': 1,'Receive on Modbus': 2}
    disabled_by_default: true
  - platform: modbus_controller
    id: modbus_temperature_sensor_status
    name: "Inputs - Modbus Temperature Sensor Status"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4400
    #1-based address: 4401
    optimistic: true
    optionsmap: {'OK': 0,'NOK': 1}
    disabled_by_default: true


# -----------------------------------------------------------------------------
# Circuit 1 - A130 - Heat Status (21000 -> 21099)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: circuit1_operation_mode
    name: "Circuit 1 - Heat Status - Operation Mode"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 20999
    #1-based address: 21000
    optimistic: true
    optionsmap: {'Automatic': 0,'Comfort': 1,'Saving': 2,'Frost protection': 3}


number:
# -----------------------------------------------------------------------------
# System Settings (2000 -> 3999 )
# -----------------------------------------------------------------------------
# Offset (in mins.) to adjust time, eg. timezones
# Note that it is (despite being signed dword), not possible to use negative
# numbers. Those will be set to zero by the ECL120
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: time_timezone_offset
    name: "${model} - Time TimeZone Offset"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 2050
    #1-based address: 2051
    value_type: S_DWORD
    min_value: 0
    max_value: 1440   # Max. allowed is 65535
    step: 1
    unit_of_measurement: "min."
    icon: mdi:clock-plus-outline
    register_type: holding
    disabled_by_default: true


# -----------------------------------------------------------------------------
# Inputs (4000 -> 5999)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: measurement_source_modbus
    name: "Inputs - Measurement Source Modbus"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4399
    #1-based address: 4400
    value_type: S_WORD
    min_value: -6400
    max_value: 19200
    step: 1
    multiply: 0.01
    unit_of_measurement: "°C"
    register_type: holding
    disabled_by_default: true


# -----------------------------------------------------------------------------
# Circuit 1 - A130 - Heat References (21200 -> 21299)
# -----------------------------------------------------------------------------
# Circuit 1 – Supply temperature (flow temperature / heating curve)
# DK: Fremløbstemperatur for kreds 1
# -----------------------------------------------------------------------------
