button:
# -----------------------------------------------------------------------------
# System Info (1 -> 1999)
# -----------------------------------------------------------------------------
# Button will trigger an update of the UTC value as reported by the SNTP
# -----------------------------------------------------------------------------
  - platform: output
    name: "${model} - Synchronize Time UTC"
    id: sync_time
    output: write_epoch
    duration: 50ms
    disabled_by_default: true


output:
# -----------------------------------------------------------------------------
# System Info (1 -> 1999)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: write_epoch
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 621
    #1-based address: 622
    value_type: U_DWORD
    register_type: holding
    use_write_multiple: true
    write_lambda: |-
      if (x < 0.5f)
        return {};

      // Get current UTC Unix epoch
      uint32_t epoch = id(${shortname}sntp_time).now().timestamp;

      // Split into two 16-bit registers (MSW first)
      const uint16_t registers[2] = {
        (uint16_t)(epoch >> 16),
        (uint16_t)(epoch & 0xFFFF)
      };

      // Write both registers using the new API
      item->write_multiple_registers(1111, registers);

      return {};
