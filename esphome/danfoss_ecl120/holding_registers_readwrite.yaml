    # DK: Min. fremløbstemperatur for kreds 1
    id: circuit1_heat_flow_temperature_minimum_reference
    name: "Circuit 1 - Heat References - Heat Flow Temperature Minimum Reference"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 21201
    #1-based address: 21202
    value_type: FP32
    min_value: 5
    max_value: 150
    step: 1.0
    unit_of_measurement: °C
    device_class: temperature
    icon: "mdi:thermometer-water"
    register_type: holding
  - platform: modbus_controller
    # DK: Max. fremløbstemperatur for kreds 1
    id: circuit1_heat_flow_temperature_maximum_reference
