switch:
# -----------------------------------------------------------------------------
# System Settings (2000 -> 3999 )
# -----------------------------------------------------------------------------
# Offset (in mins.) to adjust time, eg. timezones
# Note that it is (despite being signed dword), not possible to use negative
# numbers. Those will be set to zero by the ECL120
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: time_daylight_saving_active
    name: "${model} - Time Daylight Saving Active"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 2049
    #1-based address: 2050
    register_type: holding
    bitmask: 1
    disabled_by_default: true


# -----------------------------------------------------------------------------
# Circuit 1 - A130 - Heat Status (21000 -> 21099)
