sensor:
# -----------------------------------------------------------------------------
# Circuit 1 - A130 - Heat Status (21000 -> 21099)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: holding_21000
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 20999
    #1-based address: 21000
    register_type: holding
    value_type: U_WORD
    on_value:
      then:
        lambda: |- 
          switch (static_cast<int>(x)) {
            case 0:
              id(circuit1_operation_mode).publish_state("Automatic");
              break;
            case 1:
              id(circuit1_operation_mode).publish_state("Comfort");
              break;
            case 2:
              id(circuit1_operation_mode).publish_state("Saving");
              break;
            case 3:
              id(circuit1_operation_mode).publish_state("Frost protection");
              break;
            default:
              id(circuit1_operation_mode).publish_state("Unknown");
          }
    internal: true


# -----------------------------------------------------------------------------
# System Settings (2000 -> 3999 )
# -----------------------------------------------------------------------------
# Offset (in mins.) to adjust time, eg. timezones
# Note that it is (despite being signed dword), not possible to use negative
# numbers. Those will be set to zero by the ECL120
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    id: time_timezone_offset
    name: "${model} - Time TimeZone Offset"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 2050
    #1-based address: 2051
    value_type: S_DWORD
    accuracy_decimals: 0
    unit_of_measurement: "min."
    register_type: holding
    entity_category: diagnostic
    disabled_by_default: true


# -----------------------------------------------------------------------------
# Inputs (4000 -> 5999)
# -----------------------------------------------------------------------------
  - platform: modbus_controller
    # Note that both 4398=1 & 4399=2 needs to be configured for SCADA Outdoor Temperature write
    id: holding_4398
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4397
    #1-based address: 4398
    register_type: holding
    value_type: U_WORD
    on_value:
      then:
        lambda: |- 
          switch (static_cast<int>(x)) {
            case 0:
              id(outdoor_temperature_source).publish_state("Physical sensor");
              break;
            case 1:
              id(outdoor_temperature_source).publish_state("Modbus");
              break;
            default:
              id(outdoor_temperature_source).publish_state("Reserved");
          }
    internal: true
  - platform: modbus_controller
    # Note that both 4398=1 & 4399=2 needs to be configured for SCADA Outdoor Temperature write
    id: holding_4399
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4398
    #1-based address: 4399
    register_type: holding
    value_type: U_WORD
    on_value:
      then:
        lambda: |- 
          switch (static_cast<int>(x)) {
            case 0:
              id(outdoor_temperature_share_config).publish_state("Sharing Off");
              break;
            case 1:
              id(outdoor_temperature_share_config).publish_state("Share on Modbus");
              break;
            case 2:
              id(outdoor_temperature_share_config).publish_state("Receive on Modbus");
              break;
            default:
              id(outdoor_temperature_share_config).publish_state("Unknown");
          }
    internal: true
  - platform: modbus_controller
    id: measurement_source_modbus
    name: "Inputs - Measurement Source Modbus"
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4399
    #1-based address: 4400
    register_type: holding
    value_type: S_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    unit_of_measurement: "°C"
    disabled_by_default: true
  - platform: modbus_controller
    id: holding_4401
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 4400
    #1-based address: 4401
    register_type: holding
    value_type: U_WORD
    on_value:
      then:
        lambda: |- 
          switch (static_cast<int>(x)) {
            case 0:
              id(outdoor_temperature_share_config).publish_state("OK");
              break;
            case 1:
              id(outdoor_temperature_share_config).publish_state("NOK");
              break;
            default:
              id(outdoor_temperature_share_config).publish_state("Unknown");
          }
    internal: true


