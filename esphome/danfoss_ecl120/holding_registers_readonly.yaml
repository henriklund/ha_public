  - platform: modbus_controller
    # Boost
    id: holding_21003
    modbus_controller_id: ${modbus_ctrl_id}_15
    address: 21002
    #1-based address: 21003
    register_type: holding
    value_type: U_WORD
    on_value:
      then:
        lambda: |- 
